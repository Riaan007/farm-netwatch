<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#070b14">
    <title>Wi-Fi links · Farm Netwatch</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M20 3 34 11v18L20 37 6 29V11z" fill="none" stroke="%2322d3ee" stroke-width="3"/><circle cx="20" cy="20" r="5" fill="%2334d399"/></svg>'>
    <link rel="stylesheet" href="/app.css">
    <style>
        :root { color-scheme: dark; }
        body { background-color: #070b14; }
        *, ::before, ::after { border-color: rgba(148,163,184,.18); }
        .bg-noc { position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background:
                radial-gradient(1100px 520px at 12% -10%, rgba(34,211,238,.14), transparent 60%),
                radial-gradient(900px 480px at 88% -5%, rgba(99,102,241,.12), transparent 55%),
                radial-gradient(800px 700px at 50% 115%, rgba(16,185,129,.07), transparent 60%); }
        .hdr { background: rgba(7,11,20,.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(148,163,184,.12); }
        .hdr-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(34,211,238,.55), rgba(16,185,129,.4), transparent); }
        .brand-text { background: linear-gradient(90deg, #67e8f9, #bae6fd 45%, #6ee7b7);
            -webkit-background-clip: text; background-clip: text; color: transparent; }
        .panel { background: linear-gradient(180deg, rgba(148,163,184,.09), rgba(148,163,184,.03));
            border: 1px solid rgba(148,163,184,.14); border-radius: 1rem;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .tbar { display: flex; align-items: center; gap: .5rem; flex-shrink: 0;
            overflow-x: auto; scrollbar-width: none; max-width: 100%; }
        .tbar::-webkit-scrollbar { display: none; }
        .tbtn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
            height: 34px; padding: 0 .7rem; white-space: nowrap; border-radius: .6rem;
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em;
            color: #cbd5e1; background: rgba(148,163,184,.10);
            border: 1px solid rgba(148,163,184,.16); transition: all .15s ease; }
        .tbtn:hover { background: rgba(148,163,184,.20); color: #e2e8f0; }
        .tbtn-on { color: #67e8f9; background: rgba(34,211,238,.18); border-color: rgba(34,211,238,.45); }
        .tbtn-primary { color: #fff; background: #0891b2; border-color: rgba(103,232,249,.45); }
        .tbtn.hidden { display: none; }
        .chip { display: inline-flex; align-items: center; gap: .3rem; height: 22px;
            padding: 0 .55rem; border-radius: 999px; font-size: 10.5px; font-weight: 700;
            white-space: nowrap; }
        /* Chart guide lines mark the thresholds radiomon actually alerts on, so a
           series can be read against the same numbers that fire the alerts. */
        .guide { stroke: rgba(251,191,36,.35); stroke-dasharray: 3 3; }
        .guide-bad { stroke: rgba(244,63,94,.35); stroke-dasharray: 3 3; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.2); border-radius: 8px; border: 2px solid #070b14; }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-200 flex flex-col antialiased">
    <div class="bg-noc"></div>

    <header class="hdr sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3 sm:gap-4">
            <div class="flex items-center gap-3 min-w-0 flex-1">
                <span class="text-2xl shrink-0">📡</span>
                <div class="min-w-0">
                    <h1 class="text-lg sm:text-xl lg:text-2xl font-bold tracking-tight truncate">
                        <span class="brand-text">Wi-Fi links &amp; history</span>
                    </h1>
                    <p id="subtitle" class="text-slate-400 text-xs italic">Loading telemetry…</p>
                </div>
            </div>
            <div class="tbar">
                <button onclick="setRange(24)"  id="r-24"  class="tbtn tbtn-on">24 h</button>
                <button onclick="setRange(168)" id="r-168" class="tbtn">7 d</button>
                <button onclick="setRange(720)" id="r-720" class="tbtn">30 d</button>
                <button onclick="pollNow()" id="poll-btn" class="tbtn tbtn-primary" title="Read every radio right now instead of waiting for the next scan">Poll now</button>
                <a href="/" class="tbtn">← Dashboard</a>
            </div>
        </div>
        <div class="hdr-line"></div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 flex-grow w-full space-y-6">
        <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        <div id="findings"></div>
        <div id="links"></div>
        <div id="radios"></div>
    </main>

    <script>
        let HOURS = 24, DATA = null;

        function esc(s){
            return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
        }
        function fmtAgo(ts){
            if(!ts) return 'never';
            const s = Math.floor(Date.now()/1000) - ts;
            if(s < 90) return s+'s ago';
            if(s < 5400) return Math.round(s/60)+'m ago';
            if(s < 172800) return Math.round(s/3600)+'h ago';
            return Math.round(s/86400)+'d ago';
        }
        function num(v, dp=0){ return (v==null || isNaN(v)) ? '—' : Number(v).toFixed(dp); }

        // Signal colouring uses radiomon's own bands so the page and the alerts
        // never disagree about what "poor" means.
        function sigClass(v){
            if(v == null) return 'text-slate-400';
            if(v <= -82) return 'text-rose-300';
            if(v <= -75) return 'text-amber-300';
            if(v >= -65) return 'text-emerald-300';
            return 'text-slate-200';
        }
        function scoreClass(v){
            if(v == null) return 'text-slate-400';
            if(v <= 35) return 'text-rose-300';
            if(v <= 50) return 'text-amber-300';
            return 'text-emerald-300';
        }

        // ---- charts -------------------------------------------------------
        // Plain inline SVG: no chart library, no CDN — this dashboard has to work
        // on a farm with the internet down.
        function chart(series, field, opts){
            opts = opts || {};
            const ts = series.ts || [];
            const raw = series[field] || [];
            const pts = [];
            for(let i=0; i<raw.length; i++) if(raw[i] != null) pts.push([ts[i], raw[i]]);
            if(pts.length < 2) return '<p class="text-[11px] text-slate-500 py-3">Not enough samples yet for a trend.</p>';
            const W = 700, H = 90, PAD = 4;
            const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
            let lo = Math.min(...ys), hi = Math.max(...ys);
            if(opts.guides) opts.guides.forEach(g => { lo = Math.min(lo, g.v); hi = Math.max(hi, g.v); });
            if(hi - lo < (opts.minSpan || 4)){ const mid=(hi+lo)/2, h=(opts.minSpan||4)/2; lo=mid-h; hi=mid+h; }
            const x0 = xs[0], x1 = xs[xs.length-1] || x0+1;
            const X = t => PAD + (t - x0) * (W - 2*PAD) / ((x1 - x0) || 1);
            const Y = v => PAD + (hi - v) * (H - 2*PAD) / ((hi - lo) || 1);
            const line = pts.map(p => X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
            const area = 'M'+X(pts[0][0]).toFixed(1)+','+H+' L'+pts.map(p => X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' L')+' L'+X(pts[pts.length-1][0]).toFixed(1)+','+H+' Z';
            const guides = (opts.guides||[]).map(g =>
                '<line x1="0" y1="'+Y(g.v).toFixed(1)+'" x2="'+W+'" y2="'+Y(g.v).toFixed(1)+'" class="'+(g.bad?'guide-bad':'guide')+'"/>'
                + '<text x="2" y="'+(Y(g.v)-2).toFixed(1)+'" fill="'+(g.bad?'#fb7185':'#fbbf24')+'" font-size="8" opacity=".8">'+esc(g.label)+'</text>').join('');
            const stroke = opts.stroke || '#22d3ee';
            return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="w-full" style="height:'+(opts.height||90)+'px">'
                 + '<defs><linearGradient id="g-'+field+'" x1="0" y1="0" x2="0" y2="1">'
                 + '<stop offset="0" stop-color="'+stroke+'" stop-opacity=".28"/><stop offset="1" stop-color="'+stroke+'" stop-opacity="0"/></linearGradient></defs>'
                 + guides
                 + '<path d="'+area+'" fill="url(#g-'+field+')"/>'
                 + '<polyline points="'+line+'" fill="none" stroke="'+stroke+'" stroke-width="1.4" stroke-linejoin="round"/>'
                 + '</svg>'
                 + '<div class="flex justify-between text-[9px] text-slate-500 -mt-1">'
                 + '<span>'+new Date(x0*1000).toLocaleString()+'</span>'
                 + '<span>'+num(lo,0)+' … '+num(hi,0)+(opts.unit? ' '+opts.unit : '')+'</span>'
                 + '<span>'+new Date(x1*1000).toLocaleString()+'</span></div>';
        }

        function statCell(label, value, cls, sub){
            return '<div class="p-2 bg-[#050b16] border border-white/10 rounded-lg">'
                 + '<div class="text-[9px] font-bold text-slate-500 uppercase">'+esc(label)+'</div>'
                 + '<div class="text-sm font-mono '+(cls||'text-slate-200')+'">'+esc(value)+'</div>'
                 + (sub ? '<div class="text-[9px] text-slate-500">'+esc(sub)+'</div>' : '')
                 + '</div>';
        }

        // ---- render -------------------------------------------------------
        function render(){
            const d = DATA;
            const radios = d.radios || [];
            const allLinks = radios.flatMap(r => r.links.map(l => ({radio: r, link: l})));
            const crit = (d.problems||[]).filter(p => p.level === 'crit').length;
            const warn = (d.problems||[]).length - crit;

            document.getElementById('subtitle').innerText =
                radios.length + ' radio(s) · ' + allLinks.length + ' link record(s) · last ' + (HOURS>=24 ? (HOURS/24)+' day(s)' : HOURS+' h');

            document.getElementById('summary').innerHTML = [
                ['Radios read', radios.filter(r => r.ok).length + ' / ' + radios.length, 'text-slate-100'],
                ['Links tracked', String(allLinks.length), 'text-slate-100'],
                ['Critical', String(crit), crit ? 'text-rose-400' : 'text-slate-500'],
                ['Warnings', String(warn), warn ? 'text-amber-400' : 'text-slate-500'],
            ].map(([l, v, c]) =>
                '<div class="panel p-4"><p class="text-slate-500 text-xs font-semibold uppercase tracking-wider">'+l+'</p>'
                + '<p class="text-3xl font-bold tabular-nums '+c+'">'+v+'</p></div>').join('');

            const f = document.getElementById('findings');
            f.innerHTML = (d.problems||[]).length
                ? '<div class="panel p-4"><h2 class="text-sm font-bold text-amber-300 uppercase tracking-tight mb-3">⚠️ Current findings</h2>'
                  + '<div class="space-y-2">' + d.problems.map(p =>
                        '<div class="p-3 rounded-lg border '+(p.level==='crit'
                            ? 'border-rose-400/40 bg-rose-500/10' : 'border-amber-400/40 bg-amber-500/10')+'">'
                        + '<div class="flex items-center gap-2 flex-wrap">'
                        + '<span class="chip '+(p.level==='crit'?'bg-rose-500/20 text-rose-200':'bg-amber-500/20 text-amber-200')+'">'+esc(p.metric)+'</span>'
                        + '<b class="text-sm">'+esc(p.device)+'</b>'
                        + '<span class="text-xs text-slate-300">'+esc(p.what)+'</span></div>'
                        + '<p class="text-[11px] text-slate-400 mt-1">→ '+esc(p.hint)+'</p></div>').join('')
                  + '</div></div>'
                : '<div class="panel p-4 text-sm text-emerald-300">✓ No wireless problems detected in the current readings.</div>';

            // Links first: a farm's problems live in the links, not the radios.
            document.getElementById('links').innerHTML =
                '<h2 class="text-sm font-bold text-slate-300 uppercase tracking-tight mb-3">Wireless links</h2>'
                + (allLinks.length
                    ? '<div class="space-y-4">' + allLinks.map(({radio, link}) => linkCard(radio, link)).join('') + '</div>'
                    : '<div class="panel p-4 text-sm text-slate-400">No links recorded yet. Radios are read on the scan cadence, and only those with a saved login can be read.</div>');

            document.getElementById('radios').innerHTML =
                '<h2 class="text-sm font-bold text-slate-300 uppercase tracking-tight mb-3 mt-6">Radios</h2>'
                + '<div class="space-y-4">' + radios.map(radioCard).join('') + '</div>';
        }

        function linkCard(radio, l){
            const s = l.stats || {};
            const sig = s.signal || {}, rem = s.remote_signal || {}, dl = s.score_dl || {}, ul = s.score_ul || {};
            const base = sig.baseline != null ? 'normally ' + num(sig.baseline) : 'baseline building';
            const dist = l.distance == null ? '—' : (l.distance >= 1000 ? (l.distance/1000).toFixed(1)+' km' : l.distance+' m');
            return '<div class="panel p-4">'
                + '<div class="flex items-start justify-between gap-3 flex-wrap mb-3">'
                +   '<div class="min-w-0">'
                +     '<h3 class="font-bold text-slate-100 truncate">'+esc(l.name)+' <span class="text-slate-500 font-normal">↔ '+esc(radio.name)+'</span></h3>'
                +     '<p class="text-[11px] text-slate-500 font-mono">'+esc(l.ip||l.peer)+(l.model? ' · '+esc(l.model):'')+' · '+dist+' · read '+fmtAgo(l.last_ts)+'</p>'
                +   '</div>'
                +   '<button onclick="exportLink(\''+esc(radio.key)+'\',\''+esc(l.peer)+'\')" class="tbtn" title="Download this link\'s samples as CSV">CSV</button>'
                + '</div>'
                + '<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">'
                +   statCell('Signal now', num(sig.now)+' dBm', sigClass(sig.now), base)
                +   statCell('Far end hears', num(rem.now)+' dBm', sigClass(rem.now))
                +   statCell('Score ↓/↑', num(dl.now)+' / '+num(ul.now), scoreClass(Math.min(dl.now==null?99:dl.now, ul.now==null?99:ul.now)),
                              dl.baseline!=null ? 'normally '+num(dl.baseline)+' / '+num(ul.baseline) : '')
                +   statCell('Range (min…max)', num(sig.min)+' … '+num(sig.max), 'text-slate-300', sig.n ? sig.n+' samples' : '')
                + '</div>'
                + '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">'
                +   '<div><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Signal (dBm)</p>'
                +     chart(l.series, 'signal', {stroke:'#22d3ee', unit:'dBm', minSpan:8,
                            guides:[{v:-75,label:'weak'},{v:-82,label:'poor',bad:true}]}) + '</div>'
                +   '<div><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">airMAX link score ↓</p>'
                +     chart(l.series, 'score_dl', {stroke:'#a78bfa', minSpan:20,
                            guides:[{v:50,label:'poor'},{v:35,label:'bad',bad:true}]}) + '</div>'
                + '</div></div>';
        }

        function radioCard(r){
            if(!r.ok){
                return '<div class="panel p-4 border-rose-400/30">'
                    + '<h3 class="font-bold text-slate-100">'+esc(r.name)+' <span class="text-[11px] font-mono text-slate-500">'+esc(r.ip||'')+'</span></h3>'
                    + '<p class="text-xs text-rose-300 mt-1">Could not be read over SSH: '+esc(r.error||'unknown')+'</p>'
                    + '<p class="text-[11px] text-slate-500 mt-1">This says nothing about whether the device is online — it is a credentials / SSH-access problem.</p></div>';
            }
            const c = r.current || {}, st = r.stats || {};
            return '<div class="panel p-4">'
                + '<div class="flex items-start justify-between gap-3 flex-wrap mb-3">'
                +   '<div class="min-w-0"><h3 class="font-bold text-slate-100 truncate">'+esc(r.name)
                +     ' <span class="text-[11px] font-mono text-slate-500">'+esc(r.ip||'')+'</span></h3>'
                +     '<p class="text-[11px] text-slate-500">'+esc(r.mode||'')+(r.ssid? ' · '+esc(r.ssid):'')
                +     (r.model? ' · '+esc(r.model):'')+' · read '+fmtAgo(r.last_ts)+'</p></div>'
                + '</div>'
                + '<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">'
                +   statCell('Noise floor', num(c.noise)+' dBm', 'text-slate-200',
                              (st.noise && st.noise.baseline!=null) ? 'normally '+num(st.noise.baseline) : '')
                +   statCell('Air time', num(c.airtime,1)+'%', (c.airtime>=80?'text-rose-300':c.airtime>=60?'text-amber-300':'text-slate-200'))
                +   statCell('Capacity ↓', c.cap_dl ? Math.round(c.cap_dl/1000)+' Mbps' : '—', 'text-slate-200',
                              (st.cap_dl && st.cap_dl.baseline) ? 'normally '+Math.round(st.cap_dl.baseline/1000)+' Mbps' : '')
                +   statCell('Links', String(c.links==null?'—':c.links), 'text-slate-200')
                + '</div>'
                + '<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">'
                +   '<div><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Noise floor (dBm)</p>'
                +     chart(r.series, 'noise', {stroke:'#f472b6', unit:'dBm', minSpan:8}) + '</div>'
                +   '<div><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Air time (%)</p>'
                +     chart(r.series, 'airtime', {stroke:'#fbbf24', unit:'%', minSpan:20,
                            guides:[{v:80,label:'busy'},{v:92,label:'saturated',bad:true}]}) + '</div>'
                +   '<div><p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Capacity ↓ (kbps)</p>'
                +     chart(r.series, 'cap_dl', {stroke:'#34d399', minSpan:1000}) + '</div>'
                + '</div></div>';
        }

        // ---- csv: the raw samples, for a spreadsheet or a supplier ----------
        function exportLink(radioKey, peer){
            const r = (DATA.radios||[]).find(x => x.key === radioKey);
            const l = r && r.links.find(x => x.peer === peer);
            if(!l) return;
            const f = ['signal','remote_signal','score_dl','score_ul','tx','rx','latency'];
            const rows = [['time', ...f].join(',')];
            (l.series.ts||[]).forEach((t, i) =>
                rows.push([new Date(t*1000).toISOString(), ...f.map(k => (l.series[k]||[])[i] ?? '')].join(',')));
            const blob = new Blob(['﻿' + rows.join('\n')], {type: 'text/csv;charset=utf-8'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'wifi-' + (l.name||peer).replace(/[^A-Za-z0-9_-]+/g,'-') + '-' + HOURS + 'h.csv';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        }

        // ---- load ----------------------------------------------------------
        async function load(){
            try {
                DATA = await (await fetch('/api/radio/links?hours=' + HOURS)).json();
            } catch(e){
                document.getElementById('subtitle').innerText = 'Could not load telemetry: ' + e;
                return;
            }
            if(!DATA.ok){ document.getElementById('subtitle').innerText = DATA.error || 'No data'; return; }
            render();
        }
        function setRange(h){
            HOURS = h;
            ['24','168','720'].forEach(x => document.getElementById('r-'+x).classList.toggle('tbtn-on', String(h)===x));
            load();
        }
        async function pollNow(){
            const b = document.getElementById('poll-btn');
            b.disabled = true; b.innerText = 'Polling…';
            try { await fetch('/api/radio/poll', {method:'POST'}); } catch(e){}
            // The poll runs off-thread over SSH; give the slowest radio a chance.
            setTimeout(async () => { await load(); b.disabled = false; b.innerText = 'Poll now'; }, 20000);
        }
        load();
        setInterval(load, 120000);
    </script>
</body>
</html>
